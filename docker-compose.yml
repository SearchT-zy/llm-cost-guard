services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: llmcg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: llmcg
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 仅绑回环：开发时宿主机可连 localhost:5432；不需要外部访问数据库
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmcg"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      # 容器内网直连 postgres 服务（覆盖 .env 里的 localhost 地址）
      DATABASE_URL: postgresql://llmcg:${POSTGRES_PASSWORD:-change-me}@postgres:5432/llmcg
    ports:
      - "3000:3000"

volumes:
  pgdata:
